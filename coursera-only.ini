[custom]
; ============================================================
; 仅 Coursera 走代理，其余全部直连
; ============================================================
; 本文件层面的防泄漏要点：
;   1. 全部是域名规则，没有任何 IP-CIDR / GEOIP / IP-ASN 规则
;      → 规则匹配阶段不会触发任何 DNS 解析
;   2. 不要给 Coursera 补它的 AWS/CloudFront IP 段
;      （很多人这么干，结果每次连接都要先本地解析一次，反而泄漏）
;   3. overwrite_original_rules=true 会丢弃机场自带的 ChinaIp / GEOIP 规则，
;      避免出现「排在前面、先做 IP 判断」的规则
;   4. 顺序固定：Coursera 规则在最前，FINAL 直连在最后
; ============================================================

; ---------- Coursera 自有域名 ----------
; 一条覆盖 coursera.org / .com / .app / .help / .support / .community
; 以及 coursera*.s3.amazonaws.com 这类资源桶
ruleset=🚀 Coursera,[]DOMAIN-KEYWORD,coursera

; ---------- Coursera 的 CDN ----------
; 这些不在 coursera 域名下，必须单列，否则表现为「能刷课但没图/没视频」
; d3c33hcgiwev3  视频 / 课件
ruleset=🚀 Coursera,[]DOMAIN-SUFFIX,d3c33hcgiwev3.cloudfront.net
; d3njjcbhbojbot 静态资源 / 图片
ruleset=🚀 Coursera,[]DOMAIN-SUFFIX,d3njjcbhbojbot.cloudfront.net
; d1hpa2gdx2lr6r Maestro API
ruleset=🚀 Coursera,[]DOMAIN-SUFFIX,d1hpa2gdx2lr6r.cloudfront.net

; ---------- 其余全部直连 ----------
ruleset=DIRECT,[]FINAL

; ---------- 可选：应用内第三方登录 ----------
; 用 Google / Facebook 账号登录时再取消注释
;ruleset=🚀 Coursera,[]DOMAIN,accounts.google.com
;ruleset=🚀 Coursera,[]DOMAIN,www.facebook.com

; ---------- 可选：真正的「按 App」匹配（仅 mihomo）----------
; 需要客户端 find-process-mode: always
; Android 填包名，桌面端填进程名；写成注释是因为 Clash Premium 不支持该规则
;ruleset=🚀 Coursera,[]PROCESS-NAME,org.coursera.android
;ruleset=🚀 Coursera,[]PROCESS-NAME,Coursera

; ---------- 策略组 ----------
custom_proxy_group=🚀 Coursera`select`[]♻️ 自动选择`[]DIRECT`.*
custom_proxy_group=♻️ 自动选择`url-test`.*`http://www.gstatic.com/generate_204`300,,50

enable_rule_generator=true
overwrite_original_rules=true
