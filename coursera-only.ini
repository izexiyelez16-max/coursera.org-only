[custom]
; ============================================================
; Coursera 域名白名单走代理，其余业务连接直连
; ============================================================
; 用途：subconverter 外部配置，需结合节点订阅生成 Clash YAML。
; 此 INI 不是可直接导入 Clash 的完整配置，也不包含代理节点。
;
; 使用条件：
;   1. 客户端使用规则模式（mode: rule），在「🚀 Coursera」里选择代理节点。
;   2. 网页流量须进入 Clash；不遵循系统代理的 App 须由 TUN/VPN 接管。
;   3. 域名规则依赖内核获得目标域名；TUN 场景还需正确配置 DNS，
;      可使用 fake-ip；仅获得目标 IP 且不能还原域名的连接会落入直连。
;   4. 本文件不配置 DNS，不能单凭这些规则保证没有 DNS 泄漏。
;   5. overwrite_original_rules=true 覆盖转换器基础模板中的路由规则，
;      客户端的额外覆写仍须在最终运行配置中检查。
;
; 维护原则：只添加明确的域名/资源主机，不泛代理 cloudfront.net、
; amazonaws.com 或其共享 IP 段；漏掉的课程资源需通过连接日志补齐。
; ============================================================

; ---------- Coursera 域名及其子域名 ----------
; 基础清单：https://github.com/v2fly/domain-list-community/blob/master/data/coursera
ruleset=🚀 Coursera,[]DOMAIN-SUFFIX,coursera.org
ruleset=🚀 Coursera,[]DOMAIN-SUFFIX,coursera.help
ruleset=🚀 Coursera,[]DOMAIN-SUFFIX,coursera.community
ruleset=🚀 Coursera,[]DOMAIN-SUFFIX,coursera-for-business.org
; 官方帮助中心：https://www.coursera.support/
ruleset=🚀 Coursera,[]DOMAIN-SUFFIX,coursera.support

; ---------- Coursera 资源主机：精确匹配 ----------
; 保留原文件列出的三个 CloudFront 主机；并非完整 CDN 清单。
; 图片主机可在 https://www.coursera.org/ 页面中看到。
ruleset=🚀 Coursera,[]DOMAIN,d3njjcbhbojbot.cloudfront.net
ruleset=🚀 Coursera,[]DOMAIN,d3c33hcgiwev3.cloudfront.net
ruleset=🚀 Coursera,[]DOMAIN,d1hpa2gdx2lr6r.cloudfront.net
; 作业资源桶；其他桶/区域端点需以实际课程连接日志为准。
ruleset=🚀 Coursera,[]DOMAIN,coursera-assessments.s3.amazonaws.com

; ---------- 可选：第三方登录，默认直连 ----------
; 仅在登录失败且日志证明确有需要时启用；这两条不是完整登录依赖清单。
; 启用后，其他网站/App 访问同一登录域名也会走代理，无法限定来自 Coursera。
;ruleset=🚀 Coursera,[]DOMAIN,accounts.google.com
;ruleset=🚀 Coursera,[]DOMAIN,www.facebook.com

; 不按进程强制代理整个 App：保持第三方流量按域名分流。
; 不启用自动测速组，避免额外的第三方代理测速请求。

; ---------- 其余全部直连：必须是最后一条 ruleset ----------
; subconverter 生成 Clash 配置时会转换为 MATCH,DIRECT。
ruleset=DIRECT,[]FINAL

; ---------- 策略组：手动选择订阅中的代理节点 ----------
; 不提供 DIRECT 选项；仍须确保输入订阅中确有可用代理节点。
custom_proxy_group=🚀 Coursera`select`.*

enable_rule_generator=true
overwrite_original_rules=true
